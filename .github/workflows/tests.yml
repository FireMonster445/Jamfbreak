name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q jamfbreak scripts tests
      - name: Check public tree for private data
        run: python scripts/check_public_tree.py
      - name: Run safety tests
        run: python -m tests.smoke_test
